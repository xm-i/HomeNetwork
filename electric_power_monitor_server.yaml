- hosts: electric_power_monitor
  become: no
  remote_user: root
  gather_facts: no

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Ensure power group exists
      group:
        name: power
        state: present

    - name: Ensure power user exists
      user:
        name: power
        group: power
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Allow passwordless sudo for power user
      copy:
        dest: /etc/sudoers.d/power
        content: "power ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check if root authorized_keys exists
      stat:
        path: /root/.ssh/authorized_keys
      register: root_authorized_keys

    - name: Ensure power .ssh directory exists
      file:
        path: /home/power/.ssh
        state: directory
        owner: power
        group: power
        mode: "0700"

    - name: Sync SSH authorized_keys from root to power
      copy:
        src: /root/.ssh/authorized_keys
        dest: /home/power/.ssh/authorized_keys
        remote_src: yes
        owner: power
        group: power
        mode: "0600"
      when: root_authorized_keys.stat.exists

    - name: Install apt packages
      apt:
        name:
          - aspnetcore-runtime-10.0
          - ca-certificates
          - prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Install internal mkcert root CA certificate
      copy:
        src: ./common/certs/mkcert-pki.rootCA.crt
        dest: /usr/local/share/ca-certificates/mkcert-pki.rootCA.crt
        owner: root
        group: root
        mode: "0644"
      register: ca_cert_copy

    - name: Update CA certificates
      command: update-ca-certificates
      when: ca_cert_copy.changed

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Create app directory
      file:
        path: /opt/electric-power-monitor-service
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy systemd service file
      copy:
        src: ./electric_power_monitor_server/services/servicefiles/electric_power_monitor.service
        dest: /etc/systemd/system/electric_power_monitor.service
        owner: root
        group: root
        mode: "0644"
      register: epm_service_copy

    - name: Reload systemd daemon if electric_power_monitor.service changed
      systemd:
        daemon_reload: yes
      when: epm_service_copy.changed

    - name: Enable electric_power_monitor service
      service:
        name: electric_power_monitor
        enabled: yes

    - name: Check if electric_power_monitor binary is deployed
      stat:
        path: /opt/electric-power-monitor-service/ElectricPowerMonitorService.dll
      register: epm_binary

    - name: Start electric_power_monitor service if binary is deployed
      service:
        name: electric_power_monitor
        state: started
      when: epm_binary.stat.exists
      register: epm_started

    - name: Restart electric_power_monitor service if unit file changed and binary is deployed
      systemd:
        name: electric_power_monitor
        state: restarted
      when:
        - epm_binary.stat.exists
        - epm_service_copy.changed
        - not (epm_started.changed | default(false))
