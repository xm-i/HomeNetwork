global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/rules.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
          - 'watch-server.internal:9100'
          - 'home.internal:9100'
          - 'db-server.internal:9100'
          - 'batch-server.internal:9100'
          - 'dns-server.internal:9100'
          - 'pinpon-server.internal:9100'
          - 'aqua-raspi.internal:9100'
          # - 'recorder.internal:9100'
        labels:
          environment: 'production'

  # SNMP: Yamaha RTX1210 Router
  - job_name: 'snmp_router'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '10.0.0.1' # rtx1210.internal
        labels:
          device: 'rtx1210'
          role: 'router'
          environment: 'production'
    metrics_path: /snmp
    params:
      module: [rtx1210]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # SNMP: L2 Switches (NETGEAR / Yamaha SWX)
  - job_name: 'snmp_switch'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '10.0.0.3' # xs708t.internal (10G Switch)
        labels:
          role: 'l2switch'
          environment: 'production'
    metrics_path: /snmp
    params:
      module: [l2switch]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # SNMP: ASUSTOR NAS
  - job_name: 'snmp_nas'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '10.0.0.5' # nas.internal
        labels:
          device: 'asustor-nas'
          role: 'storage'
          environment: 'production'
    metrics_path: /snmp
    params:
      module: [asustor]
      auth: [public_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # Recorder: EPGStation & Mirakurun
  - job_name: 'recorder'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'recorder-exporter:9876'
        labels:
          device: 'recorder'
          role: 'recorder'
          environment: 'production'

  # Blackbox Exporter 自身の死活監視
  - job_name: 'blackbox_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'blackbox-exporter:9115'

  # HTTPS 外形監視 (home.internal Nginx 配下)
  - job_name: 'blackbox_https'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'https://home.internal/'
          - 'https://dashboard.home.internal/'
          - 'https://jenkins.home.internal/login'
          - 'https://monitor.home.internal/api/health'
          - 'https://grafana.home.internal/api/health'
          - 'https://recorder.home.internal/'
          - 'https://rundeck.home.internal/user/login'
          - 'https://pinpon.home.internal/'
        labels:
          environment: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HTTPS 外形監視 (ルートが 404 を返す API サーバー向け)
  - job_name: 'blackbox_https_api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [http_2xx_404]
    static_configs:
      - targets:
          - 'https://dashboard-api.home.internal/'
        labels:
          environment: 'production'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
