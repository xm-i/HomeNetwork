global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
          - 'watch-server.internal:9100'
          - 'home-server.internal:9100'
          - 'db-server.internal:9100'
          - 'batch-server.internal:9100'
          - 'raspi.internal:9100'
          - 'aqua-raspi.internal:9100'
          # - 'recorder.internal:9100'
        labels:
          environment: 'production'
