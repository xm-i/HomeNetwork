            type: gauge
      - name: asustorVolumeTotalSizeGB
        oid: 1.3.6.1.4.1.44738.5.1.1.6
        type: gauge
        help: Total volume size in GB.
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: asustorVolumeFreeSizeGB
        oid: 1.3.6.1.4.1.44738.5.1.1.7
        type: gauge
        help: Remaining free volume size in GB.
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: asustorUpsManufacture
        oid: 1.3.6.1.4.1.44738.6.1.1.2
        type: DisplayString
        help: UPS manufacturer.
        indexes:
          - labelname: upsIndex
            type: gauge
      - name: asustorUpsModel
        oid: 1.3.6.1.4.1.44738.6.1.1.3
        type: DisplayString
        help: UPS model.
        indexes:
          - labelname: upsIndex
            type: gauge
      - name: asustorUpsStatus
        oid: 1.3.6.1.4.1.44738.6.1.1.7
        type: DisplayString
        help: UPS status string.
        indexes:
          - labelname: upsIndex
            type: gauge
      - name: asustorUpsBatteryRemainSecond
        oid: 1.3.6.1.4.1.44738.6.1.1.8
