# SNMP Exporter configuration for Yamaha RTX1210, L2 Switches, and ASUSTOR NAS
auths:
  public_v2:
    community: public
    version: 2

modules:
  # Yamaha RTX1210 Router
  rtx1210:
    walk:
      - 1.3.6.1.2.1.1.3      # sysUpTime
      - 1.3.6.1.2.1.2.2.1.1  # ifIndex
      - 1.3.6.1.2.1.2.2.1.2  # ifDescr
      - 1.3.6.1.2.1.2.2.1.3  # ifType
      - 1.3.6.1.2.1.2.2.1.5  # ifSpeed
      - 1.3.6.1.2.1.2.2.1.8  # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.14 # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20 # ifOutErrors
      - 1.3.6.1.2.1.31.1.1.1.1 # ifName
      - 1.3.6.1.2.1.31.1.1.1.6 # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.18 # ifAlias
      - 1.3.6.1.4.1.1182.2.1.4 # yrhMemoryUtil
      - 1.3.6.1.4.1.1182.2.1.5 # yrhCpuUtil5sec
      - 1.3.6.1.4.1.1182.2.1.6 # yrhCpuUtil1min
      - 1.3.6.1.4.1.1182.2.1.15 # yrhInboxTemperature
    get:
      - 1.3.6.1.2.1.1.3.0
      - 1.3.6.1.4.1.1182.2.1.4.0
      - 1.3.6.1.4.1.1182.2.1.5.0
      - 1.3.6.1.4.1.1182.2.1.6.0
      - 1.3.6.1.4.1.1182.2.1.15.0
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time (in hundredths of a second) since network initialization.
      - name: yrhMemoryUtil
        oid: 1.3.6.1.4.1.1182.2.1.4
        type: gauge
        help: The utilization in percentage of main memory.
      - name: yrhCpuUtil5sec
        oid: 1.3.6.1.4.1.1182.2.1.5
        type: gauge
        help: The average utilization of CPU in 5 seconds.
      - name: yrhCpuUtil1min
        oid: 1.3.6.1.4.1.1182.2.1.6
        type: gauge
        help: The average utilization of CPU in 1 minutes.
      - name: yrhInboxTemperature
        oid: 1.3.6.1.4.1.1182.2.1.15
        type: gauge
        help: The internal temperature in degrees Celsius.
      - name: ifIndex
        oid: 1.3.6.1.2.1.2.2.1.1
        type: gauge
        help: A unique value for each interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: Description of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifType
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: The type of interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: Interface current bandwidth in bps.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Operational state (1=up, 2=down).
        indexes:
          - labelname: ifIndex
            type: gauge
        enum_values:
          1: up
          2: down
          3: testing
          4: unknown
          5: dormant
          6: notPresent
          7: lowerLayerDown
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Number of inbound packets that contained errors.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Number of outbound packets that could not be transmitted because of errors.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: Textual name of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Total received octets on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Total transmitted octets on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: User-configured alias name.
        indexes:
          - labelname: ifIndex
            type: gauge

  # Standard L2 Switch (NETGEAR, Yamaha SWX, etc.)
  l2switch:
    walk:
      - 1.3.6.1.2.1.1.3      # sysUpTime
      - 1.3.6.1.2.1.2.2.1.1  # ifIndex
      - 1.3.6.1.2.1.2.2.1.2  # ifDescr
      - 1.3.6.1.2.1.2.2.1.3  # ifType
      - 1.3.6.1.2.1.2.2.1.5  # ifSpeed
      - 1.3.6.1.2.1.2.2.1.8  # ifOperStatus
      - 1.3.6.1.2.1.2.2.1.14 # ifInErrors
      - 1.3.6.1.2.1.2.2.1.20 # ifOutErrors
      - 1.3.6.1.2.1.31.1.1.1.1 # ifName
      - 1.3.6.1.2.1.31.1.1.1.6 # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10 # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.18 # ifAlias
    get:
      - 1.3.6.1.2.1.1.3.0
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: The time (in hundredths of a second) since network initialization.
      - name: ifIndex
        oid: 1.3.6.1.2.1.2.2.1.1
        type: gauge
        help: A unique value for each interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
        help: Description of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifType
        oid: 1.3.6.1.2.1.2.2.1.3
        type: gauge
        help: The type of interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: Interface current bandwidth in bps.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: Operational state (1=up, 2=down).
        indexes:
          - labelname: ifIndex
            type: gauge
        enum_values:
          1: up
          2: down
          3: testing
          4: unknown
          5: dormant
          6: notPresent
          7: lowerLayerDown
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Number of inbound packets that contained errors.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Number of outbound packets that could not be transmitted because of errors.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifName
        oid: 1.3.6.1.2.1.31.1.1.1.1
        type: DisplayString
        help: Textual name of the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Total received octets on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Total transmitted octets on the interface.
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifAlias
        oid: 1.3.6.1.2.1.31.1.1.1.18
        type: DisplayString
        help: User-configured alias name.
        indexes:
          - labelname: ifIndex
            type: gauge

  # ASUSTOR NAS
  asustor:
    walk:
      - 1.3.6.1.2.1.1.3          # sysUpTime
      - 1.3.6.1.4.1.44738.1.1    # sysSerialNumber
      - 1.3.6.1.4.1.44738.1.2    # sysADMVersion
      - 1.3.6.1.4.1.44738.2.1    # modelName
      - 1.3.6.1.4.1.44738.2.2    # processorName
      - 1.3.6.1.4.1.44738.2.3.1.2 # cpuUsage
      - 1.3.6.1.4.1.44738.2.4.1.2 # fanSpeed
      - 1.3.6.1.4.1.44738.2.5.1.2 # temperatureCpu
      - 1.3.6.1.4.1.44738.2.5.1.3 # temperatureSys
      - 1.3.6.1.4.1.44738.2.6.1.2 # memoryTotal
      - 1.3.6.1.4.1.44738.2.6.1.3 # memoryFree
      - 1.3.6.1.4.1.44738.2.6.1.4 # memoryFreePercentage
      - 1.3.6.1.4.1.44738.4.1.1.2 # diskID
      - 1.3.6.1.4.1.44738.4.1.1.3 # diskModel
      - 1.3.6.1.4.1.44738.4.1.1.4 # diskType
      - 1.3.6.1.4.1.44738.4.1.1.5 # diskStatus
      - 1.3.6.1.4.1.44738.4.1.1.6 # diskSmartStatus
      - 1.3.6.1.4.1.44738.4.1.1.7 # diskTemperature
      - 1.3.6.1.4.1.44738.4.1.1.8 # diskSize
      - 1.3.6.1.4.1.44738.5.1.1.2 # volumeName
      - 1.3.6.1.4.1.44738.5.1.1.3 # volumeLevel
      - 1.3.6.1.4.1.44738.5.1.1.4 # volumeStatus
      - 1.3.6.1.4.1.44738.5.1.1.5 # volumeFileSystem
      - 1.3.6.1.4.1.44738.5.1.1.6 # volumeTotalSize
      - 1.3.6.1.4.1.44738.5.1.1.7 # volumeFreeSize
      - 1.3.6.1.4.1.44738.6.1.1.2 # upsManufacture
      - 1.3.6.1.4.1.44738.6.1.1.3 # upsModel
      - 1.3.6.1.4.1.44738.6.1.1.7 # upsStatus
      - 1.3.6.1.4.1.44738.6.1.1.8 # upsBatteryRemainSecond
      - 1.3.6.1.4.1.44738.6.1.1.9 # upsBatteryChargePercent
      - 1.3.6.1.4.1.44738.6.1.1.10 # upsBatteryChargeLowPercent
      - 1.3.6.1.4.1.44738.6.1.1.11 # upsInputVoltage
      - 1.3.6.1.2.1.31.1.1.1.6   # ifHCInOctets
      - 1.3.6.1.2.1.31.1.1.1.10  # ifHCOutOctets
      - 1.3.6.1.2.1.31.1.1.1.1   # ifName
      - 1.3.6.1.2.1.2.2.1.8      # ifOperStatus
    get:
      - 1.3.6.1.2.1.1.3.0
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: System uptime.
      - name: asustorSysSerialNumber
        oid: 1.3.6.1.4.1.44738.1.1
        type: DisplayString
        help: Asustor system serial number.
      - name: asustorSysADMVersion
        oid: 1.3.6.1.4.1.44738.1.2
        type: DisplayString
        help: Asustor ADM version.
      - name: asustorModelName
        oid: 1.3.6.1.4.1.44738.2.1
        type: DisplayString
        help: Asustor model name.
      - name: asustorProcessorName
        oid: 1.3.6.1.4.1.44738.2.2
        type: DisplayString
        help: Asustor CPU model.
      - name: asustorCPUUsage
        oid: 1.3.6.1.4.1.44738.2.3.1.2
        type: gauge
        help: CPU usage percentage.
        indexes:
          - labelname: cpuIndex
            type: gauge
      - name: asustorFanSpeed
        oid: 1.3.6.1.4.1.44738.2.4.1.2
        type: gauge
        help: Fan speed in RPM.
        indexes:
          - labelname: fanIndex
            type: gauge
      - name: asustorCPUTemperature
        oid: 1.3.6.1.4.1.44738.2.5.1.2
        type: gauge
        help: CPU temperature in Celsius.
        indexes:
          - labelname: temperatureIndex
            type: gauge
      - name: asustorSysTemperature
        oid: 1.3.6.1.4.1.44738.2.5.1.3
        type: gauge
        help: System temperature in Celsius.
        indexes:
          - labelname: temperatureIndex
            type: gauge
      - name: asustorTotalMemMB
        oid: 1.3.6.1.4.1.44738.2.6.1.2
        type: gauge
        help: Total memory in MB.
        indexes:
          - labelname: memoryIndex
            type: gauge
      - name: asustorFreeMemMB
        oid: 1.3.6.1.4.1.44738.2.6.1.3
        type: gauge
        help: Free memory in MB.
        indexes:
          - labelname: memoryIndex
            type: gauge
      - name: asustorFreeMemPercentage
        oid: 1.3.6.1.4.1.44738.2.6.1.4
        type: gauge
        help: Percentage of free memory.
        indexes:
          - labelname: memoryIndex
            type: gauge
      - name: asustorDiskID
        oid: 1.3.6.1.4.1.44738.4.1.1.2
        type: DisplayString
        help: Disk bay name.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskModel
        oid: 1.3.6.1.4.1.44738.4.1.1.3
        type: DisplayString
        help: Disk model.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskType
        oid: 1.3.6.1.4.1.44738.4.1.1.4
        type: DisplayString
        help: Disk type.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskStatus
        oid: 1.3.6.1.4.1.44738.4.1.1.5
        type: DisplayString
        help: Disk health status string.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskSmartStatus
        oid: 1.3.6.1.4.1.44738.4.1.1.6
        type: DisplayString
        help: Disk SMART status string.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskTemperature
        oid: 1.3.6.1.4.1.44738.4.1.1.7
        type: gauge
        help: Disk temperature in Celsius.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorDiskSizeGB
        oid: 1.3.6.1.4.1.44738.4.1.1.8
        type: gauge
        help: Disk size in GB.
        indexes:
          - labelname: diskIndex
            type: gauge
      - name: asustorVolumeName
        oid: 1.3.6.1.4.1.44738.5.1.1.2
        type: DisplayString
        help: Volume name.
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: asustorVolumeLevel
        oid: 1.3.6.1.4.1.44738.5.1.1.3
        type: DisplayString
        help: Volume RAID level.
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: asustorVolumeStatus
        oid: 1.3.6.1.4.1.44738.5.1.1.4
        type: DisplayString
        help: Volume status string.
        indexes:
          - labelname: volumeIndex
            type: gauge
      - name: asustorVolumeFileSystem
        oid: 1.3.6.1.4.1.44738.5.1.1.5
        type: DisplayString
        help: Volume file system.
        indexes:
