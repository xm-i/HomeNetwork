version: "3"

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./data/prometheus:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - snmp-exporter
      - recorder-exporter
      - blackbox-exporter
      - alertmanager

  recorder-exporter:
    build:
      context: ./recorder_exporter
    container_name: recorder-exporter
    restart: always
    environment:
      - EPGSTATION_URL=http://recorder.internal:8888
      - MIRAKURUN_URL=http://recorder.internal:40772
      - PORT=9876
      - SCRAPE_INTERVAL=15
      - TZ=Asia/Tokyo
    env_file:
      - env_file
    ports:
      - "9876:9876"

  snmp-exporter:
    image: prom/snmp-exporter:v0.26.0
    container_name: snmp-exporter
    restart: always
    volumes:
      - ./snmp_exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro
    ports:
      - "9116:9116"

  snmptrapd:
    build:
      context: ./snmptrapd
    container_name: snmptrapd
    restart: always
    env_file:
      - env_file
    ports:
      - "162:162/udp"
    volumes:
      - ./mibs:/etc/snmp/mibs:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: blackbox-exporter
    restart: always
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    volumes:
      - ./blackbox_exporter/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: alertmanager
    restart: always
    env_file:
      - env_file
    environment:
      - TZ=Asia/Tokyo
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        WEBHOOK="$${ALERT_WEBHOOK_URL:-$${SNMP_TRAP_WEBHOOK_URL}}"
        if [ -z "$$WEBHOOK" ]; then
          echo "ERROR: ALERT_WEBHOOK_URL and SNMP_TRAP_WEBHOOK_URL are both empty." >&2
          sleep 30
          exit 1
        fi
        printf '%s' "$$WEBHOOK" > /tmp/slack_webhook_url
        exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager --web.external-url=http://watch-server.internal:9093/
    tmpfs:
      - /tmp
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - env_file
    environment:
      - GF_SERVER_ROOT_URL=http://monitor.home-server.internal/
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
