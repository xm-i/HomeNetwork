- hosts: pinpon
  become: no
  remote_user: root
  gather_facts: no

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Ensure pinpon group exists
      group:
        name: pinpon
        state: present

    - name: Ensure pinpon user exists
      user:
        name: pinpon
        group: pinpon
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Allow passwordless sudo for pinpon user
      copy:
        dest: /etc/sudoers.d/pinpon
        content: "pinpon ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check if root authorized_keys exists
      stat:
        path: /root/.ssh/authorized_keys
      register: root_authorized_keys

    - name: Ensure pinpon .ssh directory exists
      file:
        path: /home/pinpon/.ssh
        state: directory
        owner: pinpon
        group: pinpon
        mode: "0700"

    - name: Sync SSH authorized_keys from root to pinpon
      copy:
        src: /root/.ssh/authorized_keys
        dest: /home/pinpon/.ssh/authorized_keys
        remote_src: yes
        owner: pinpon
        group: pinpon
        mode: "0600"
      when: root_authorized_keys.stat.exists

    - name: Install apt packages
      apt:
        name:
          - aspnetcore-runtime-10.0
          - prometheus-node-exporter
          - ffmpeg
        state: present
        update_cache: yes

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Create app directory
      file:
        path: /opt/pinpon
        state: directory
        owner: pinpon
        group: pinpon
        mode: "0755"

    - name: Copy systemd service file
      copy:
        src: ./pinpon_server/services/servicefiles/pinpon.service
        dest: /etc/systemd/system/pinpon.service
        owner: root
        group: root
        mode: "0644"
      register: pinpon_service_copy

    - name: Reload systemd daemon if pinpon.service changed
      systemd:
        daemon_reload: yes
      when: pinpon_service_copy.changed

    - name: Enable pinpon service
      service:
        name: pinpon
        enabled: yes

    - name: Check if Pinpon application is deployed
      stat:
        path: /opt/pinpon/Pinpon.Web.dll
      register: pinpon_app_binary

    - name: Restart pinpon service if unit file changed and app is deployed
      systemd:
        name: pinpon
        state: restarted
      when: pinpon_service_copy.changed and pinpon_app_binary.stat.exists
