- hosts: cicd
  become: yes
  remote_user: cicd
  gather_facts: no

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Install apt packages
      apt:
        name:
          - podman
          - prometheus-node-exporter
          - rsync
        state: present
        update_cache: yes

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Configure sysctl for SonarQube (Elasticsearch)
      copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          vm.max_map_count=524288
          fs.file-max=131072
      notify:
        - reload sysctl

    - name: Create SonarQube directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: cicd
        group: cicd
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/sonarqube, mode: "0755" }
        - { path: /opt/sonarqube/data, mode: "0777" }
        - { path: /opt/sonarqube/extensions, mode: "0777" }
        - { path: /opt/sonarqube/logs, mode: "0777" }

    - name: Configure SonarQube env_file
      copy:
        dest: /opt/sonarqube/env_file
        owner: root
        group: root
        mode: "0600"
        content: |
          SONAR_JDBC_URL=jdbc:postgresql://db-server.internal:5432/{{ sonarqube.db.name | default('sonarqube') }}
          SONAR_JDBC_USERNAME={{ sonarqube.db.user | default('sonarqube') }}
          SONAR_JDBC_PASSWORD={{ sonarqube.db.password }}
          TZ=Asia/Tokyo
      notify:
        - reload systemd and restart sonarqube service

    - name: Copy sonarqube systemd service file
      copy:
        src: ./cicd_server/services/servicefiles/sonarqube.service
        dest: /etc/systemd/system/sonarqube.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd and restart sonarqube service

    - name: Flush handlers before starting sonarqube
      meta: flush_handlers

    - name: Enable and start sonarqube service
      service:
        name: sonarqube
        enabled: yes
        state: started

    - name: Create Jenkins directories
      file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/jenkins, mode: "0755" }
        - { path: /opt/jenkins/home, mode: "0755" }
        - { path: /opt/jenkins/home/backup, mode: "0755" }

    - name: Ensure Jenkins data directories are owned by UID/GID 1000
      command: chown -c 1000:1000 /opt/jenkins/home /opt/jenkins/home/backup
      register: jenkins_chown_result
      changed_when: jenkins_chown_result.stdout != ""

    - name: Copy Jenkins Containerfile
      copy:
        src: ./cicd_server/containers/jenkins/Containerfile
        dest: /opt/jenkins/Containerfile
        owner: root
        group: root
        mode: "0644"
      register: jenkins_containerfile_copy

    - name: Check if custom Jenkins container image exists
      command: podman image exists localhost/jenkins-custom:lts-jdk25
      register: jenkins_image_exists
      failed_when: false
      changed_when: false

    - name: Build custom Jenkins container image
      command: podman build -t localhost/jenkins-custom:lts-jdk25 -f /opt/jenkins/Containerfile /opt/jenkins
      when: jenkins_containerfile_copy.changed or jenkins_image_exists.rc != 0

    - name: Copy jenkins systemd service file
      copy:
        src: ./cicd_server/services/servicefiles/jenkins.service
        dest: /etc/systemd/system/jenkins.service
        owner: root
        group: root
        mode: "0644"
      register: jenkins_service_copy

    - name: Reload systemd daemon if jenkins.service changed
      systemd:
        daemon_reload: yes
      when: jenkins_service_copy.changed

    - name: Enable and start jenkins service
      service:
        name: jenkins
        enabled: yes
        state: started

    - name: Add jenkins backup cron job
      cron:
        name: jenkins backup
        minute: "51"
        hour: "13"
        job: "rsync /opt/jenkins/home/backup rsync://{{ ((backup_server | default({})).rsync | default({})).host | default('nas.internal') }}/jenkins_backup -r"
        state: present

  handlers:
    - name: reload sysctl
      command: sysctl --system

    - name: reload systemd and restart sonarqube service
      systemd:
        name: sonarqube
        state: restarted
        daemon_reload: yes
