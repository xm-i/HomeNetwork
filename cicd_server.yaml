- hosts: cicd
  become: yes
  remote_user: cicd
  gather_facts: no

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Install apt packages
      apt:
        name:
          - podman
          - prometheus-node-exporter
          - rsync
        state: present
        update_cache: yes

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Configure sysctl for SonarQube (Elasticsearch)
      copy:
        dest: /etc/sysctl.d/99-sonarqube.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          vm.max_map_count=524288
          fs.file-max=131072
      notify:
        - reload sysctl

    - name: Create SonarQube directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: cicd
        group: cicd
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/sonarqube, mode: "0755" }
        - { path: /opt/sonarqube/data, mode: "0777" }
        - { path: /opt/sonarqube/extensions, mode: "0777" }
        - { path: /opt/sonarqube/logs, mode: "0777" }

    - name: Configure SonarQube env_file
      copy:
        dest: /opt/sonarqube/env_file
        owner: root
        group: root
        mode: "0600"
        content: |
          SONAR_JDBC_URL=jdbc:postgresql://db-server.internal:5432/{{ sonarqube.db.name | default('sonarqube') }}
          SONAR_JDBC_USERNAME={{ sonarqube.db.user | default('sonarqube') }}
          SONAR_JDBC_PASSWORD={{ sonarqube.db.password }}
          TZ=Asia/Tokyo
      notify:
        - reload systemd and restart sonarqube service

    - name: Copy sonarqube systemd service file
      copy:
        src: ./cicd_server/services/servicefiles/sonarqube.service
        dest: /etc/systemd/system/sonarqube.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd and restart sonarqube service

    - name: Flush handlers before starting sonarqube
      meta: flush_handlers

    - name: Enable and start sonarqube service
      service:
        name: sonarqube
        enabled: yes
        state: started

    - name: Create Jenkins directories
      file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/jenkins, mode: "0755" }
        - { path: /opt/jenkins/home, mode: "0755" }
        - { path: /opt/jenkins/home/backup, mode: "0755" }

    - name: Ensure Jenkins data directories are owned by UID/GID 1000
      command: chown -c 1000:1000 /opt/jenkins/home /opt/jenkins/home/backup
      register: jenkins_chown_result
      changed_when: jenkins_chown_result.stdout != ""

    - name: Ensure Jenkins .ssh directory exists
      file:
        path: /opt/jenkins/home/.ssh
        state: directory
        owner: 1000
        group: 1000
        mode: "0700"

    - name: Configure SSH client config for Jenkins internal deployments
      copy:
        dest: /opt/jenkins/home/.ssh/config
        owner: 1000
        group: 1000
        mode: "0600"
        content: |
          Host *.internal 10.0.*
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

    - name: Copy Jenkins Containerfile
      copy:
        src: ./cicd_server/containers/jenkins/Containerfile
        dest: /opt/jenkins/Containerfile
        owner: root
        group: root
        mode: "0644"
      register: jenkins_containerfile_copy

    - name: Check if custom Jenkins container image exists
      command: podman image exists localhost/jenkins-custom:lts-jdk25
      register: jenkins_image_exists
      failed_when: false
      changed_when: false

    - name: Build custom Jenkins container image
      command: podman build -t localhost/jenkins-custom:lts-jdk25 -f /opt/jenkins/Containerfile /opt/jenkins
      when: jenkins_containerfile_copy.changed or jenkins_image_exists.rc != 0
      register: jenkins_image_build

    - name: Copy jenkins systemd service file
      copy:
        src: ./cicd_server/services/servicefiles/jenkins.service
        dest: /etc/systemd/system/jenkins.service
        owner: root
        group: root
        mode: "0644"
      register: jenkins_service_copy

    - name: Reload systemd daemon if jenkins.service changed
      systemd:
        daemon_reload: yes
      when: jenkins_service_copy.changed

    - name: Enable and start jenkins service
      service:
        name: jenkins
        enabled: yes
        state: started
      register: jenkins_service_started

    # HomeNetwork の Jenkins パイプライン自身がこのコンテナ内で動作するため、
    # 同期再起動するとジョブ完了前に自プロセスが停止する。パイプライン終了後に反映させるため遅延再起動する。
    - name: Schedule delayed restart of jenkins service if image or unit changed
      command: systemd-run --on-active=15s systemctl restart jenkins
      when: (jenkins_image_build.changed or jenkins_service_copy.changed) and not jenkins_service_started.changed

    - name: Add jenkins backup cron job
      cron:
        name: jenkins backup
        minute: "51"
        hour: "13"
        job: "rsync /opt/jenkins/home/backup rsync://{{ ((backup_server | default({})).rsync | default({})).host | default('nas.internal') }}/jenkins_backup -r"
        state: present

    - name: Create Tailscale Funnel directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/tailscale, mode: "0755" }
        - { path: /opt/tailscale/config, mode: "0755" }
        - { path: /opt/tailscale/state, mode: "0700" }

    - name: Copy Tailscale Funnel serve.json
      copy:
        src: ./cicd_server/containers/tailscale-funnel/serve.json
        dest: /opt/tailscale/config/serve.json
        owner: root
        group: root
        mode: "0644"
      register: tailscale_serve_copy

    - name: Configure Tailscale Funnel env_file
      copy:
        dest: /opt/tailscale/env_file
        owner: root
        group: root
        mode: "0600"
        content: |
          TZ=Asia/Tokyo
          TS_HOSTNAME={{ (tailscale | default({}, true)).hostname | default('jenkins-webhook', true) }}
          {% if ((tailscale | default({}, true)).authkey | default('', true)) | length > 0 -%}
          TS_AUTHKEY={{ tailscale.authkey }}
          {% endif -%}
          {% if ((tailscale | default({}, true)).extra_args | default('', true)) | length > 0 -%}
          TS_EXTRA_ARGS={{ tailscale.extra_args }}
          {% endif -%}
      no_log: true
      register: tailscale_env_copy

    - name: Copy tailscale-funnel systemd service file
      copy:
        src: ./cicd_server/services/servicefiles/tailscale-funnel.service
        dest: /etc/systemd/system/tailscale-funnel.service
        owner: root
        group: root
        mode: "0644"
      register: tailscale_service_copy

    - name: Reload systemd daemon if tailscale-funnel.service changed
      systemd:
        daemon_reload: yes
      when: tailscale_service_copy.changed

    - name: Check if Tailscale state file exists
      stat:
        path: /opt/tailscale/state/tailscaled.state
      register: tailscale_state_file

    - name: Determine whether Tailscale Funnel is ready to start
      set_fact:
        tailscale_funnel_ready: "{{ (((tailscale | default({}, true)).authkey | default('', true)) | length > 0) or tailscale_state_file.stat.exists }}"

    - name: Restart tailscale-funnel service when config changed
      systemd:
        name: tailscale-funnel
        state: restarted
        daemon_reload: yes
      when: (tailscale_funnel_ready | bool) and (tailscale_serve_copy.changed or tailscale_env_copy.changed or tailscale_service_copy.changed)

    - name: Enable and start tailscale-funnel service
      service:
        name: tailscale-funnel
        enabled: yes
        state: started
      when: tailscale_funnel_ready | bool

    - name: Notice if Tailscale authkey is not yet configured
      debug:
        msg: "tailscale.authkey is not configured in group_vars/cicd.yaml and /opt/tailscale/state/tailscaled.state does not exist; skipping tailscale-funnel startup."
      when: not (tailscale_funnel_ready | bool)

  handlers:
    - name: reload sysctl
      command: sysctl --system

    - name: reload systemd and restart sonarqube service
      systemd:
        name: sonarqube
        state: restarted
        daemon_reload: yes
