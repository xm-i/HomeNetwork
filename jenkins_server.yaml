- hosts: jenkins
  become: no
  remote_user: root
  gather_facts: no

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Install base apt packages
      apt:
        name:
          - openjdk-25-jre-headless
          - ansible
          - git
          - openssh-client
          - sshpass
          - rsync
          - ca-certificates
          - curl
          - gnupg
          - libicu-dev
          - fontconfig
          - python3
          - prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Check if required Ansible collections are installed
      shell: |
        test -d /usr/share/ansible/collections/ansible_collections/community/postgresql && \
        test -d /usr/share/ansible/collections/ansible_collections/community/general && \
        test -d /usr/share/ansible/collections/ansible_collections/ansible/posix
      register: ansible_collections_check
      changed_when: false
      failed_when: false

    - name: Install required Ansible collections
      shell: |
        ansible-galaxy collection install -p /usr/share/ansible/collections \
          community.postgresql \
          community.general \
          ansible.posix && \
        chmod -R a+rX /usr/share/ansible/collections
      when: ansible_collections_check.rc != 0

    - name: Ensure jenkins system group exists
      group:
        name: jenkins
        system: yes
        state: present

    - name: Ensure jenkins system user exists
      user:
        name: jenkins
        group: jenkins
        system: yes
        shell: /bin/bash
        home: /var/lib/jenkins
        create_home: no
        state: present

    - name: Ensure Jenkins base directory exists
      file:
        path: /opt/jenkins
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Jenkins data directories
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/jenkins/home
        - /opt/jenkins/home/backup

    - name: Check Jenkins home ownership
      stat:
        path: /opt/jenkins/home
      register: jenkins_home_stat

    - name: Ensure Jenkins data directories are owned by jenkins user
      command: chown -R jenkins:jenkins /opt/jenkins/home
      when: (jenkins_home_stat.stat.pw_name | default('')) != 'jenkins' or (jenkins_home_stat.stat.gr_name | default('')) != 'jenkins'

    - name: Ensure Jenkins .ssh directory exists
      file:
        path: /opt/jenkins/home/.ssh
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Configure SSH client config for Jenkins internal deployments
      copy:
        dest: /opt/jenkins/home/.ssh/config
        owner: jenkins
        group: jenkins
        mode: "0600"
        content: |
          Host *.internal 10.0.*
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

    - name: Link /var/jenkins_home to /opt/jenkins/home
      file:
        src: /opt/jenkins/home
        dest: /var/jenkins_home
        state: link
        force: yes

    - name: Check if /var/lib/jenkins exists
      stat:
        path: /var/lib/jenkins
        follow: no
      register: var_lib_jenkins_stat

    - name: Link /var/lib/jenkins to /opt/jenkins/home if absent
      file:
        src: /opt/jenkins/home
        dest: /var/lib/jenkins
        state: link
      when: not var_lib_jenkins_stat.stat.exists

    - name: Remove legacy /etc/systemd/system/jenkins.service if present
      file:
        path: /etc/systemd/system/jenkins.service
        state: absent

    - name: Ensure jenkins.service.d directory exists
      file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Jenkins systemd override configuration
      copy:
        src: ./jenkins_server/services/servicefiles/jenkins-override.conf
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
      register: jenkins_override_copy

    - name: Reload systemd daemon if Jenkins override changed
      systemd:
        daemon_reload: yes
      when: jenkins_override_copy.changed

    - name: Ensure apt keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Jenkins APT repository GPG key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Jenkins APT repository
      copy:
        dest: /etc/apt/sources.list.d/jenkins.list
        content: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/\n"
        owner: root
        group: root
        mode: "0644"

    - name: Install Jenkins package
      apt:
        name: jenkins
        state: present
        update_cache: yes
      register: jenkins_pkg_install

    - name: Enable and start jenkins service
      service:
        name: jenkins
        enabled: yes
        state: started
      register: jenkins_service_started

    # HomeNetwork の Jenkins パイプライン自身がこのサービス上で動作するため、
    # 同期再起動するとジョブ完了前に自プロセスが停止する。パイプライン終了後に反映させるため遅延再起動する。
    - name: Schedule delayed restart of jenkins service if override changed
      command: systemd-run --on-active=15s systemctl restart jenkins
      when: jenkins_override_copy.changed and not jenkins_pkg_install.changed and not jenkins_service_started.changed

    - name: Add jenkins backup cron job
      cron:
        name: jenkins backup
        minute: "51"
        hour: "13"
        job: "rsync /opt/jenkins/home/backup rsync://{{ ((backup_server | default({})).rsync | default({})).host | default('nas.internal') }}/jenkins_backup -r"
        state: present

    - name: Ensure /usr/share/keyrings directory exists
      file:
        path: /usr/share/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Tailscale APT repository GPG key
      get_url:
        url: https://pkgs.tailscale.com/stable/ubuntu/resolute.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Configure Tailscale APT repository
      copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        content: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu resolute main\n"
        owner: root
        group: root
        mode: "0644"

    - name: Install Tailscale package
      apt:
        name: tailscale
        state: present
        update_cache: yes

    - name: Disable and stop default tailscaled service
      service:
        name: tailscaled
        enabled: no
        state: stopped
      failed_when: false

    - name: Create Tailscale Funnel directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/tailscale, mode: "0755" }
        - { path: /opt/tailscale/state, mode: "0700" }

    - name: Copy Tailscale Funnel configuration script
      copy:
        src: ./jenkins_server/scripts/configure-funnel.sh
        dest: /opt/tailscale/configure-funnel.sh
        owner: root
        group: root
        mode: "0755"
      register: tailscale_script_copy

    - name: Configure Tailscale Funnel env_file
      copy:
        dest: /opt/tailscale/env_file
        owner: root
        group: root
        mode: "0600"
        content: |
          TZ=Asia/Tokyo
          TS_HOSTNAME={{ (tailscale | default({}, true)).hostname | default('jenkins-webhook', true) }}
          {% if ((tailscale | default({}, true)).authkey | default('', true)) | length > 0 -%}
          TS_AUTHKEY={{ tailscale.authkey }}
          {% endif -%}
          {% if ((tailscale | default({}, true)).extra_args | default('', true)) | length > 0 -%}
          TS_EXTRA_ARGS={{ tailscale.extra_args }}
          {% endif -%}
      no_log: true
      register: tailscale_env_copy

    - name: Copy tailscale-funnel systemd service file
      copy:
        src: ./jenkins_server/services/servicefiles/tailscale-funnel.service
        dest: /etc/systemd/system/tailscale-funnel.service
        owner: root
        group: root
        mode: "0644"
      register: tailscale_service_copy

    - name: Reload systemd daemon if tailscale-funnel.service changed
      systemd:
        daemon_reload: yes
      when: tailscale_service_copy.changed

    - name: Check if Tailscale state file exists
      stat:
        path: /opt/tailscale/state/tailscaled.state
      register: tailscale_state_file

    - name: Determine whether Tailscale Funnel is ready to start
      set_fact:
        tailscale_funnel_ready: "{{ (((tailscale | default({}, true)).authkey | default('', true)) | length > 0) or tailscale_state_file.stat.exists }}"

    - name: Restart tailscale-funnel service when config changed
      systemd:
        name: tailscale-funnel
        state: restarted
        daemon_reload: yes
      when: (tailscale_funnel_ready | bool) and (tailscale_script_copy.changed or tailscale_env_copy.changed or tailscale_service_copy.changed)

    - name: Enable and start tailscale-funnel service
      service:
        name: tailscale-funnel
        enabled: yes
        state: started
      when: tailscale_funnel_ready | bool

    - name: Notice if Tailscale authkey is not yet configured
      debug:
        msg: "tailscale.authkey is not configured in group_vars/jenkins.yaml and /opt/tailscale/state/tailscaled.state does not exist; skipping tailscale-funnel startup."
      when: not (tailscale_funnel_ready | bool)
