- hosts: dnsfilter
  become: no
  remote_user: root
  gather_facts: no

  vars:
    adguardhome_version: "v1.0.0"

  tasks:
    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Ensure dnsfilter group exists
      group:
        name: dnsfilter
        state: present

    - name: Ensure dnsfilter user exists
      user:
        name: dnsfilter
        group: dnsfilter
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Allow passwordless sudo for dnsfilter user
      copy:
        dest: /etc/sudoers.d/dnsfilter
        content: "dnsfilter ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check if root authorized_keys exists
      stat:
        path: /root/.ssh/authorized_keys
      register: root_authorized_keys

    - name: Ensure dnsfilter .ssh directory exists
      file:
        path: /home/dnsfilter/.ssh
        state: directory
        owner: dnsfilter
        group: dnsfilter
        mode: "0700"

    - name: Sync SSH authorized_keys from root to dnsfilter
      copy:
        src: /root/.ssh/authorized_keys
        dest: /home/dnsfilter/.ssh/authorized_keys
        remote_src: yes
        owner: dnsfilter
        group: dnsfilter
        mode: "0600"
      when: root_authorized_keys.stat.exists

    - name: Disable DNSStubListener in systemd-resolved (to free port 53 for DNS filter)
      lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^#?DNSStubListener='
        line: 'DNSStubListener=no'
      notify:
        - restart systemd-resolved

    - name: Link /etc/resolv.conf to systemd upstream resolv.conf
      file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: yes

    - name: Flush handlers to apply systemd-resolved changes before package install
      meta: flush_handlers

    - name: Install apt packages
      apt:
        name:
          - ca-certificates
          - curl
          - prometheus-node-exporter
          - python3
          - rsync
          - tar
        state: present
        update_cache: yes

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    - name: Create DNS filter directories
      file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/dnsfilter, mode: "0755" }
        - { path: /opt/dnsfilter/bin, mode: "0755" }
        - { path: /opt/dnsfilter/conf, mode: "0755" }
        - { path: /opt/dnsfilter/work, mode: "0755" }
        - { path: /opt/dnsfilter/work/userfilters, mode: "0755" }
        - { path: /opt/dnsfilter/scripts, mode: "0755" }

    - name: Check if AdGuard Home binary is installed
      stat:
        path: "/opt/dnsfilter/bin/AdGuardHome-{{ adguardhome_version }}"
      register: adguardhome_bin

    - name: Download AdGuard Home release archive
      get_url:
        url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguardhome_version }}/AdGuardHome_linux_amd64.tar.gz"
        dest: "/tmp/AdGuardHome-{{ adguardhome_version }}.tar.gz"
        mode: "0644"
      when: not adguardhome_bin.stat.exists

    - name: Install AdGuard Home binary
      shell: |
        rm -rf /tmp/adguardhome-extract && \
        mkdir -p /tmp/adguardhome-extract && \
        tar -xzf "/tmp/AdGuardHome-{{ adguardhome_version }}.tar.gz" -C /tmp/adguardhome-extract && \
        install -m 0755 /tmp/adguardhome-extract/AdGuardHome/AdGuardHome "/opt/dnsfilter/bin/AdGuardHome-{{ adguardhome_version }}" && \
        rm -rf /tmp/adguardhome-extract "/tmp/AdGuardHome-{{ adguardhome_version }}.tar.gz"
      when: not adguardhome_bin.stat.exists

    - name: Link active AdGuard Home binary
      file:
        src: "/opt/dnsfilter/bin/AdGuardHome-{{ adguardhome_version }}"
        dest: /opt/dnsfilter/bin/AdGuardHome
        state: link
      register: adguardhome_link

    - name: Copy 280blocker update script
      copy:
        src: ./dnsfilter_server/scripts/update_280blocker.py
        dest: /opt/dnsfilter/scripts/update_280blocker.py
        owner: root
        group: root
        mode: "0755"

    - name: Initialize 280blocker filter file if missing
      command: python3 /opt/dnsfilter/scripts/update_280blocker.py --init
      args:
        creates: /opt/dnsfilter/work/userfilters/280blocker.txt

    - name: Seed initial AdGuardHome.yaml if missing
      copy:
        src: ./dnsfilter_server/config/AdGuardHome.yaml
        dest: /opt/dnsfilter/conf/AdGuardHome.yaml
        owner: root
        group: root
        mode: "0600"
        force: no

    - name: Migrate legacy container work paths in AdGuardHome.yaml
      replace:
        path: /opt/dnsfilter/conf/AdGuardHome.yaml
        regexp: '/opt/adguardhome/work/'
        replace: '/opt/dnsfilter/work/'
      register: adguardhome_path_migrated

    - name: Copy dnsfilter systemd service file
      copy:
        src: ./dnsfilter_server/services/servicefiles/dnsfilter.service
        dest: /etc/systemd/system/dnsfilter.service
        owner: root
        group: root
        mode: "0644"
      register: dnsfilter_service_copy

    - name: Reload systemd daemon if dnsfilter.service changed
      systemd:
        daemon_reload: yes
      when: dnsfilter_service_copy.changed

    - name: Enable and start dnsfilter service
      service:
        name: dnsfilter
        enabled: yes
        state: started
      register: dnsfilter_started

    - name: Restart dnsfilter service when unit, binary, or config path changed
      systemd:
        name: dnsfilter
        state: restarted
        daemon_reload: yes
      when: (dnsfilter_service_copy.changed or adguardhome_link.changed or adguardhome_path_migrated.changed) and not dnsfilter_started.changed

    - name: Add daily 280blocker update cron job
      cron:
        name: 280blocker filter update
        minute: "15"
        hour: "5"
        job: "python3 /opt/dnsfilter/scripts/update_280blocker.py"
        state: present

    - name: Add DNS filter config backup cron job
      cron:
        name: dnsfilter config backup
        minute: "45"
        hour: "13"
        job: "rsync -a /opt/dnsfilter/conf/ rsync://{{ ((backup_server | default({})).rsync | default({})).host | default('nas.internal') }}/dnsfilter_backup/"
        state: present

  handlers:
    - name: restart systemd-resolved
      service:
        name: systemd-resolved
        state: restarted
