- hosts: sonarqube
  become: no
  remote_user: root
  gather_facts: no

  vars:
    sonarqube_version: "26.11.0.134175"

  tasks:
    - name: Load SonarQube credentials from group_vars/jenkins.yaml if not defined in group_vars/sonarqube.yaml
      include_vars:
        file: group_vars/jenkins.yaml
      when: sonarqube is not defined
      no_log: true

    - name: Set timezone
      timezone:
        name: Asia/Tokyo

    - name: Ensure sonar group exists
      group:
        name: sonar
        state: present

    - name: Ensure sonar user exists
      user:
        name: sonar
        group: sonar
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Allow passwordless sudo for sonar user
      copy:
        dest: /etc/sudoers.d/sonar
        content: "sonar ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Check if root authorized_keys exists
      stat:
        path: /root/.ssh/authorized_keys
      register: root_authorized_keys

    - name: Ensure sonar .ssh directory exists
      file:
        path: /home/sonar/.ssh
        state: directory
        owner: sonar
        group: sonar
        mode: "0700"

    - name: Sync SSH authorized_keys from root to sonar
      copy:
        src: /root/.ssh/authorized_keys
        dest: /home/sonar/.ssh/authorized_keys
        remote_src: yes
        owner: sonar
        group: sonar
        mode: "0600"
      when: root_authorized_keys.stat.exists

    - name: Install base apt packages
      apt:
        name:
          - openjdk-25-jre-headless
          - ca-certificates
          - curl
          - unzip
          - locales
          - prometheus-node-exporter
        state: present
        update_cache: yes

    - name: Check if en_US.UTF-8 locale is generated
      shell: locale -a | grep -qi '^en_US\.utf-\?8$'
      register: en_us_locale_check
      changed_when: false
      failed_when: false

    - name: Generate en_US.UTF-8 locale
      command: locale-gen en_US.UTF-8
      when: en_us_locale_check.rc != 0

    - name: Ensure prometheus-node-exporter is enabled and started
      service:
        name: prometheus-node-exporter
        enabled: yes
        state: started

    # SonarQube (Elasticsearch): Proxmox VE host already sets vm.max_map_count = 1048576 (>= 524288).
    # Unprivileged LXC cannot write vm.max_map_count, so sysctl configuration inside LXC is skipped.
    - name: Ensure sonarqube system group exists
      group:
        name: sonarqube
        system: yes
        state: present

    - name: Ensure sonarqube system user exists
      user:
        name: sonarqube
        group: sonarqube
        system: yes
        shell: /usr/sbin/nologin
        home: /opt/sonarqube
        create_home: no
        state: present

    - name: Ensure SonarQube root directory exists
      file:
        path: /opt/sonarqube
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create SonarQube data directories
      file:
        path: "{{ item }}"
        state: directory
        owner: sonarqube
        group: sonarqube
        mode: "0755"
      loop:
        - /opt/sonarqube/data
        - /opt/sonarqube/extensions
        - /opt/sonarqube/logs
        - /opt/sonarqube/temp

    - name: Check if SonarQube archive is already extracted
      stat:
        path: "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/lib/sonar-application-{{ sonarqube_version }}.jar"
      register: sonarqube_jar

    - name: Download SonarQube Community distribution
      get_url:
        url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
        dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        mode: "0644"
      when: not sonarqube_jar.stat.exists

    - name: Extract SonarQube distribution
      command: "unzip -q /tmp/sonarqube-{{ sonarqube_version }}.zip -d /opt/sonarqube"
      when: not sonarqube_jar.stat.exists

    - name: Remove downloaded SonarQube archive
      file:
        path: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
        state: absent

    - name: Remove bundled SonarQube extensions directory before symlinking
      shell: |
        if [ -e "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/extensions" ] && [ ! -L "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/extensions" ]; then
          rm -rf "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/extensions"
        fi
      when: not sonarqube_jar.stat.exists

    - name: Set ownership on extracted SonarQube directory
      command: "chown -R sonarqube:sonarqube /opt/sonarqube/sonarqube-{{ sonarqube_version }}"
      when: not sonarqube_jar.stat.exists

    - name: Link SonarQube extensions directory
      file:
        src: /opt/sonarqube/extensions
        dest: "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/extensions"
        state: link
        force: yes

    - name: Link sonarqube.jar to versioned application jar
      file:
        src: "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/lib/sonar-application-{{ sonarqube_version }}.jar"
        dest: "/opt/sonarqube/sonarqube-{{ sonarqube_version }}/lib/sonarqube.jar"
        state: link

    - name: Link /opt/sonarqube/current to active SonarQube version
      file:
        src: "/opt/sonarqube/sonarqube-{{ sonarqube_version }}"
        dest: /opt/sonarqube/current
        state: link
      notify:
        - reload systemd and restart sonarqube service

    - name: Configure SonarQube env_file
      copy:
        dest: /opt/sonarqube/env_file
        owner: root
        group: root
        mode: "0600"
        content: |
          SONAR_JDBC_URL=jdbc:postgresql://db-server.internal:5432/{{ sonarqube.db.name | default('sonarqube') }}
          SONAR_JDBC_USERNAME={{ sonarqube.db.user | default('sonarqube') }}
          SONAR_JDBC_PASSWORD={{ sonarqube.db.password }}
          SONAR_PATH_DATA=/opt/sonarqube/data
          SONAR_PATH_LOGS=/opt/sonarqube/logs
          SONAR_PATH_TEMP=/opt/sonarqube/temp
          TZ=Asia/Tokyo
      no_log: true
      notify:
        - reload systemd and restart sonarqube service

    - name: Copy sonarqube systemd service file
      copy:
        src: ./sonarqube_server/services/servicefiles/sonarqube.service
        dest: /etc/systemd/system/sonarqube.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - reload systemd and restart sonarqube service

    - name: Flush handlers before starting sonarqube
      meta: flush_handlers

    - name: Enable and start sonarqube service
      service:
        name: sonarqube
        enabled: yes
        state: started

  handlers:
    - name: reload systemd and restart sonarqube service
      systemd:
        name: sonarqube
        state: restarted
        daemon_reload: yes
